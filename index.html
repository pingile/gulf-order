<style id="css">
:root{--g:#00843D;--g2:#e6f4ec;--n:#1F3864;--rb:#C00000;--bg:#f3f5f7;--card:#fff;--mut:#6b7280;--line:#e5e7eb;--y:#fff7d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111;font-size:16px}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
.tools{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:19;background:var(--bg);padding:8px 12px 6px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:11px 12px;border:1px solid #cfd4da;border-radius:10px;font-size:16px;background:#fff}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid #cfd4da;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:#333}
.chip.on{background:var(--n);border-color:var(--n);color:#fff}
main{padding:8px 10px calc(110px + env(safe-area-inset-bottom))}
.sec{margin:12px 0 4px}
.sech{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#dfe6f3;color:var(--n);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.sech.rb{background:var(--rb);color:#fff}
.sech .cnt{font-weight:500;font-size:12px;opacity:.85}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;margin-top:6px}
.item.ordered{border-color:var(--g);background:var(--g2)}
.item.inactive{opacity:.55;background:#eef0f2}
.item.inactive .nm{text-decoration:line-through}
.info{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;font-size:15px;line-height:1.25}
.meta{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.last{background:#fff2cc;color:#7a5b00;border-radius:6px;padding:1px 6px;font-weight:600}
.last.none{background:#f1f1f1;color:#999;font-weight:500}
.tag{border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tag.in{background:#ddd;color:#555}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid #cfd4da;background:#fff;font-size:22px;line-height:1;color:var(--n)}
.step button.plus{background:var(--g);border-color:var(--g);color:#fff}
.step input{width:44px;height:38px;text-align:center;font-size:17px;font-weight:700;border:1px solid #cfd4da;border-radius:10px;background:var(--y)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bar .sum{flex:1;font-size:13px;color:var(--mut)}
.bar .sum b{font-size:17px;color:#111}
.home-h{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 4px}
.link{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-weight:600;color:var(--n);cursor:pointer}
.prog{background:#fff7d6;border:1px solid #f0d27a;border-radius:12px;padding:14px;margin-top:10px}
.tools.hide{display:none}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;background:var(--n);color:#fff}
.btn.g{background:var(--g)}.btn.r{background:#b42318}.btn.o{background:#fff;color:var(--n);border:1px solid #cfd4da}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--rb);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px;color:var(--n)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.f{font-family:inherit;width:100%;padding:11px;border:1px solid #cfd4da;border-radius:10px;font-size:16px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.tog{display:flex;border:1px solid #cfd4da;border-radius:10px;overflow:hidden}
.tog button{flex:1;padding:11px;border:0;background:#fff;font-size:15px;font-weight:600;color:#555}
.tog button.on.a{background:var(--g);color:#fff}.tog button.on.i{background:#777;color:#fff}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1}
.rv{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rv div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rv div:last-child{border-bottom:0}
.rv .h{background:#eef2f8;font-weight:700;color:var(--n);font-size:12.5px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;display:none}
.ro{background:#fff3cd;color:#664d03;font-size:13px;padding:8px 12px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#printArea{display:none}
@media print{html,body{background:#fff!important}body>*:not(#printArea){display:none!important}#printArea{display:block;font-family:Arial,sans-serif;color:#000}
#printArea h1{font-size:18pt;margin:0 0 4px;color:#00843D}#printArea table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:10px}
#printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:left}#printArea th{background:#1F3864;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .s td{background:#D9E1F2;font-weight:bold;-webkit-print-color-adjust:exact;print-color-adjust:exact}#printArea td.q{text-align:center;font-weight:bold;width:50px}}
</style>

// ---------- data model ----------

function SV(loc,vid){return (loc||L()).vend[vid||ST.curVen]}
function V(){return SV()}
function newSV(){return {acct:'',rep:'',phone:'',email:'',cc:'',items:[],sections:[],last:{},history:[],nextOrderNo:1001,lastOrderDate:''}}
function lastOf(it){var v=V().last[it.id];return v==null?'':v}

function ensureAll(){
  // 1) very old single-list format -> one location
  if(!ST.locations||!ST.locations.length){var last={};(ST.items||[]).forEach(function(it){if(it.last!=null&&it.last!==''){last[it.id]=it.last;}delete it.last;});

// ---------- import (spreadsheet / PDF) ----------
function loadScript(src){return new Promise(function(res,rej){if(document.querySelector('script[src="'+src+'"]')){res();return;}var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'))};document.head.appendChild(s);});}
function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}
function readFileRows(file){
  var name=file.name.toLowerCase();
  if(/\.csv$|\.txt$/.test(name))return file.text().then(parseCSV);
  if(/\.xlsx?$/.test(name))return loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').then(function(){return file.arrayBuffer()}).then(function(buf){var wb=XLSX.read(buf,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});});
  if(/\.pdf$/.test(name))return loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js').then(function(){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return file.arrayBuffer();})
    .then(function(buf){return pdfjsLib.getDocument({data:buf}).promise;}).then(function(pdf){var all=[],p=Promise.resolve();
      for(var n=1;n<=pdf.numPages;n++)(function(n){p=p.then(function(){return pdf.getPage(n)}).then(function(pg){return pg.getTextContent()}).then(function(tc){
        var lines={};tc.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3);(lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str});});
        Object.keys(lines).map(Number).sort(function(a,b){return b-a}).forEach(function(y){var cells=lines[y].sort(function(a,b){return a.x-b.x});
          var row=[],prev=null;cells.forEach(function(c){if(prev!==null&&c.x-prev<12&&row.length)row[row.length-1]+=' '+c.s.trim();else row.push(c.s.trim());prev=c.x+c.s.length*4;});all.push(row);});});})(n);
      return p.then(function(){return all});});
  return Promise.reject(new Error('type'));}
function importSheet(){
  open('<h2>Import item list</h2><div class="note" style="margin-top:0;font-size:14px;color:#333">For <b>'+esc(VN().name)+'</b> at <b>'+esc(L().name)+'</b>.</div>'+
   '<label>Choose a file</label><input class="f" type="file" id="im_file" accept=".xlsx,.xls,.csv,.pdf">'+
   '<div class="note">Works with Excel (.xlsx), CSV and PDF files that contain real text. A <b>scanned or handwritten PDF</b> can\'t be read here – send it to Claude to turn into a spreadsheet first.</div>'+

function mapColumns(rows,fname){
  var w=Math.max.apply(null,rows.map(function(r){return r.length}));
  var hdr=rows[0].map(function(c){return c.toLowerCase()});
  var looksHdr=hdr.some(function(c){return /product|item|description|name|size|pack|section|category|type/.test(c)});
  var used={};function guess(re,def){for(var i=0;i<w;i++)if(!used[i]&&re.test(hdr[i]||'')){used[i]=1;return i;}return def;}
  var g={name:looksHdr?guess(/product|item|description|name/,0):0,size:looksHdr?guess(/size|oz|ml/,-1):-1,pack:looksHdr?guess(/pack|pk|count|qty per/,-1):-1,type:looksHdr?guess(/type|container|unit/,-1):-1,sec:looksHdr?guess(/section|category|group|dept/,-1):-1};
  function opts(sel,opt){var o=opt?'<option value="-1">— none —</option>':'';for(var i=0;i<w;i++){var sample=(looksHdr?rows[0][i]:rows[0][i])||'';o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>Column '+String.fromCharCode(65+i)+(sample?': '+esc(sample.slice(0,24)):'')+'</option>';}return o;}
  open('<h2>Match the columns</h2><div class="note" style="margin-top:0">'+esc(fname)+' – '+rows.length+' rows found.</div>'+
   '<label><input type="checkbox" id="mp_h"'+(looksHdr?' checked':'')+'> First row is column headings</label>'+
   '<label>Product name (required)</label><select class="f" id="mp_name">'+opts(g.name,false)+'</select>'+
   '<div class="row"><div><label>Size</label><select class="f" id="mp_size">'+opts(g.size,true)+'</select></div><div><label>Pack</label><select class="f" id="mp_pack">'+opts(g.pack,true)+'</select></div></div>'+
   '<div class="row"><div><label>Type</label><select class="f" id="mp_type">'+opts(g.type,true)+'</select></div><div><label>Section</label><select class="f" id="mp_sec">'+opts(g.sec,true)+'</select></div></div>'+
   '<label>Default section (if none)</label><input class="f" id="mp_defsec" value="GENERAL">'+
   '<label>How to import</label><div class="tog" id="mp_mode"><button data-v="add" class="a on">Add to current list</button><button data-v="replace" class="i">Replace current list</button></div>'+
   '<label>Preview</label><div class="rv" id="mp_prev"></div>'+
   '<div class="acts"><button class="btn o" id="mp_x">Cancel</button><button class="btn g" id="mp_ok">Import</button></div>');
  var mode='add';
  $('mp_mode').onclick=function(e){var b=e.target.closest('button');if(!b)return;mode=b.dataset.v;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)})};
  function build(){var h=$('mp_h').checked,c={name:+$('mp_name').value,size:+$('mp_size').value,pack:+$('mp_pack').value,type:+$('mp_type').value,sec:+$('mp_sec').value},ds=($('mp_defsec').value.trim()||'GENERAL').toUpperCase();
    return rows.slice(h?1:0).map(function(r){function v(i){return i>=0?(r[i]||''):''}return {name:v(c.name),size:v(c.size),pack:v(c.pack),type:v(c.type),sec:(v(c.sec)||ds).toUpperCase()}}).filter(function(x){return x.name});}
  function prev(){var it=build();$('mp_prev').innerHTML='<div class="h"><span>'+it.length+' items will be imported</span><span></span></div>'+it.slice(0,6).map(function(x){return '<div><span>'+esc(x.name)+' <span style="color:#6b7280">'+esc([x.size,x.pack,x.type].filter(Boolean).join(' · '))+'</span></span><span style="color:#6b7280;font-size:12px">'+esc(x.sec)+'</span></div>'}).join('')+(it.length>6?'<div><span style="color:#6b7280">…and '+(it.length-6)+' more</span><span></span></div>':'');}
  ['mp_h','mp_name','mp_size','mp_pack','mp_type','mp_sec','mp_defsec'].forEach(function(id){$(id).onchange=prev;$(id).oninput=prev;});prev();
  $('mp_x').onclick=close;
  $('mp_ok').onclick=function(){var it=build();if(!it.length){toast('No products found – check the Product column');return;}
    var b=this;if(mode==='replace'&&!b.dataset.c){b.dataset.c=1;b.textContent='Tap again – replaces '+V().items.length+' items';return;}
    var sv=V();if(mode==='replace'){sv.items=[];sv.sections=[];draft={};saveDraft();}
    it.forEach(function(x){if(sv.sections.indexOf(x.sec)<0)sv.sections.push(x.sec);sv.items.push({id:'i'+(ST.nextId++),sec:x.sec,name:x.name,size:x.size,pack:x.pack,type:x.type,active:true});});
    close();itemsTab='carried';persist(it.length+' items imported for '+VN().name);};}

// ---------- orders ----------
function nextNo(sv,vn){sv=sv||V();vn=vn||VN();return (vn.code||'PO')+'-'+(sv.nextOrderNo||1001)}
function orderLines(){return V().items.filter(function(it){return it.active&&draft[it.id]>0})}
function oLines(o){return o.lines.map(function(l){return Array.isArray(l)?{sec:'',name:l[0],size:'',pack:'',type:'',qty:l[1]}:l})}
function oUnits(o){return oLines(o).reduce(function(a,l){return a+(+l.qty||0)},0)}
function ldesc(l){return [l.size,l.pack&&l.pack!=='1'?l.pack:'',l.type].filter(Boolean).join(' · ')}
function ctx(vid){return {l:L(),sv:SV(null,vid),vn:findVen(vid)}}
function orderText(o,c){var t='PURCHASE ORDER – '+c.vn.name+'\n\n'+(c.l.name||'')+(c.l.addr?'\n'+c.l.addr:'')+(c.sv.acct?'\n'+c.vn.name+' account #: '+c.sv.acct:'')+'\nOrder #: '+o.no+'\nDate: '+fmtDate(o.date)+'\n';var cur='';
  oLines(o).forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;t+='\n'+cur+'\n'}t+='  '+l.qty+' x '+l.name+(ldesc(l)?' ('+ldesc(l)+')':'')+'\n'});
  return t+'\nTotal: '+oUnits(o)+' units, '+o.lines.length+' items';}
function review(){
  var lines=orderLines();
  if(!lines.length){open('<h2>Review order</h2><div class="empty">Nothing on this order yet.<br>Tap <b>Continue ordering</b> and use + next to the items you need.</div><div class="acts"><button class="btn g" id="r_x">Continue ordering</button></div>');$('r_x').onclick=function(){nav('order')};return;}
  var cur='',h='';lines.forEach(function(it){if(it.sec!==cur){cur=it.sec;h+='<div class="h"><span>'+esc(cur)+'</span><span>Qty</span></div>'}h+='<div><span>'+esc(it.name)+' <span style="color:#6b7280">'+esc(desc(it))+'</span></span><b>'+draft[it.id]+'</b></div>'});
  var u=lines.reduce(function(a,it){return a+draft[it.id]},0);
  open('<h2>Review order <span style="font-size:14px;color:#6b7280">#'+nextNo()+'</span></h2><div class="note" style="margin-top:-6px">'+esc(VN().name)+' · '+esc(L().name)+'</div><div class="rv" style="margin-top:8px">'+h+'<div class="h"><span>TOTAL ('+lines.length+' items)</span><span>'+u+'</span></div></div>'+
  '<div class="note">Check the quantities. To add or change items, tap <b>Continue ordering</b> – you\'ll go back to where you left off.</div>'+
  '<div class="acts"><button class="btn o" id="r_x">‹ Continue ordering</button><button class="btn r" id="r_clr">Clear order</button></div>'+
  '<div class="acts"><button class="btn g" id="r_sub" style="font-size:17px;padding:15px">Submit order ➜</button></div>');
  $('r_x').onclick=function(){nav('order')};
  $('r_clr').onclick=function(){var b=this;if(b.dataset.c){draft={};saveDraft();orderY=0;nav('home');toast('Order cleared')}else{b.dataset.c=1;b.textContent='Tap again to clear'}};
  $('r_sub').onclick=function(){submitChoice(lines)};
}
function submitChoice(lines){
  var no=nextNo();
  open('<h2>Submit order #'+no+'</h2><div class="note" style="font-size:15px;color:#333">How do you want to send this order to <b>'+esc(VN().name)+'</b>?</div>'+
   '<div class="acts"><button class="btn" id="s_p" style="padding:15px">🖨 Print</button><button class="btn" id="s_e" style="padding:15px">✉ Email</button></div>'+
   '<div class="acts"><button class="btn g" id="s_b" style="padding:15px">🖨 + ✉ Both</button></div>'+
   '<div class="acts"><button class="btn o" id="s_x">Back</button></div>'+
   '<div class="note">Choosing one <b>completes</b> the order: it moves to <b>Completed Orders</b>, a backup file is saved, the quantities become each item\'s new <b>Last</b> qty, and the list is cleared for next time.</div>');
  $('s_x').onclick=review;
  $('s_p').onclick=function(){finish(lines,'p')};
  $('s_e').onclick=function(){finish(lines,'e')};
  $('s_b').onclick=function(){finish(lines,'b')};
}
function finish(lines,how){
  var vid=ST.curVen;
  if(how!=='p'&&!V().email){askEmail(vid,function(){finish(lines,how)});return;}
  var now=todayStr(),no=nextNo(),sv=V();sv.nextOrderNo=(sv.nextOrderNo||1001)+1;
  var o={no:no,date:now,sent:how==='p'?'Printed':how==='e'?'Emailed':'Printed & emailed',lines:lines.map(function(it){return {sec:it.sec,name:it.name,size:it.size,pack:it.pack,type:it.type,qty:draft[it.id]}})};
  sv.history.unshift(o);if(sv.history.length>200)sv.history.length=200;
  lines.forEach(function(it){sv.last[it.id]=draft[it.id]});
  sv.lastOrderDate=now;draft={};saveDraft();save();
  backup('PO Backup '+no+' '+now+'.json');
  orderY=0;view='home';query='';$('q').value='';close();render();window.scrollTo(0,0);
  toast('Order '+no+' completed');
  setTimeout(function(){
    if(how==='p')printOrder(o,vid);
    else if(how==='e')sendMail(o,vid);
    else{printOrder(o,vid,function(){open('<h2>Order #'+no+' printed</h2><div class="note" style="font-size:15px;color:#333">Now send the email.</div><div class="acts"><button class="btn g" id="b_e" style="padding:15px">✉ Open email</button></div><div class="acts"><button class="btn o" id="b_x">Skip</button></div>');$('b_e').onclick=function(){close();sendMail(o,vid)};$('b_x').onclick=close;});}
  },700);
}
function orderCard(o,i,openIt,vid){var ls=oLines(o),cur='',rows='';
  ls.forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;rows+='<div class="h"><span>'+esc(cur)+'</span><span>Qty</span></div>'}rows+='<div><span>'+esc(l.name)+' <span style="color:#6b7280">'+esc(ldesc(l))+'</span></span><b>'+l.qty+'</b></div>'});
  return '<details class="item" style="display:block;margin-top:8px"'+(openIt?' open':'')+'><summary style="font-weight:700;cursor:pointer;list-style:none"><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--n)">✓ '+esc(o.no||'Order')+'</span><span style="font-weight:500;color:#6b7280">'+fmtDate(o.date)+' ▾</span></div>'+
    '<div class="meta"><span>'+oUnits(o)+' units · '+ls.length+' items</span>'+(o.sent?'<span class="last" style="background:#e6f4ec;color:#00843D">'+esc(o.sent)+'</span>':'')+'</div></summary>'+
    '<div class="rv" style="margin-top:8px">'+rows+'</div><div class="acts"><button class="btn o" data-co="p" data-i="'+i+'" data-vid="'+vid+'">🖨 Print again</button><button class="btn o" data-co="e" data-i="'+i+'" data-vid="'+vid+'">✉ Email again</button></div></details>';}
function renderCompleted(){var sv=V();
  if(!sv.history.length){$('list').innerHTML='<div class="empty">No completed '+esc(VN().name)+' orders yet.</div>';return;}
  $('list').innerHTML=sv.history.map(function(o,i){return orderCard(o,i,i===0,ST.curVen)}).join('');}
function printOrder(o,vid,after){
  var c=ctx(vid),cur='',rows='';
  oLines(o).forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;rows+='<tr class="s"><td colspan="5">'+esc(cur)+'</td></tr>'}
    rows+='<tr><td>'+esc(l.name)+'</td><td>'+esc(l.size)+'</td><td>'+esc(l.pack)+'</td><td>'+esc(l.type)+'</td><td class="q">'+l.qty+'</td></tr>'});
  $('printArea').innerHTML='<h1>Purchase Order – '+esc(c.vn.name)+'</h1><div><b>'+esc(c.l.name)+'</b></div>'+(c.l.addr?'<div>'+esc(c.l.addr).replace(/\n/g,'<br>')+'</div>':'')+(c.sv.acct?'<div>'+esc(c.vn.name)+' account #: <b>'+esc(c.sv.acct)+'</b></div>':'')+
    '<div><b>Order #: '+esc(o.no)+'</b> &nbsp;&nbsp; Order date: '+fmtDate(o.date)+(c.sv.rep?' &nbsp;&nbsp; Sales rep: '+esc(c.sv.rep)+(c.sv.phone?' ('+esc(c.sv.phone)+')':''):'')+'</div>'+
    '<table><tr><th>Product</th><th>Size</th><th>Pack</th><th>Type</th><th>Qty</th></tr>'+rows+'<tr class="s"><td colspan="4">TOTAL ('+o.lines.length+' items)</td><td class="q">'+oUnits(o)+'</td></tr></table>'+
    '<p style="margin-top:30px">Received by: ______________________ &nbsp;&nbsp;&nbsp; Date: ____________</p>';
  close();
  if(after){var done=false;var go=function(){if(done)return;done=true;window.removeEventListener('afterprint',go);setTimeout(after,300)};window.addEventListener('afterprint',go);setTimeout(function(){window.print();setTimeout(go,1500)},150);}
  else setTimeout(function(){window.print()},150);}
function sendMail(o,vid){var c=ctx(vid),em=c.sv.email||'',cc=c.sv.cc||'';
  var url='mailto:'+em+'?'+(cc?'cc='+encodeURIComponent(cc)+'&':'')+'subject='+encodeURIComponent('Purchase Order '+o.no+' – '+c.l.name+(c.sv.acct?' (Acct '+c.sv.acct+')':'')+' – '+fmtDate(o.date))+'&body='+encodeURIComponent((c.sv.rep?'Hi '+c.sv.rep.split(/[ ·,]/)[0]+',\n\n':'Hello,\n\n')+'Please see our order below.\n\n'+orderText(o,c)+'\n\nThank you,\nSatyapal\n'+c.l.name);
  window.location.href=url;}
function askEmail(vid,then){var sv=SV(null,vid),vn=findVen(vid);
  open('<h2>Where should '+esc(vn.name)+' orders be emailed?</h2><div class="note" style="margin-top:-6px">For '+esc(L().name)+'</div><label>Send to</label><input class="f" id="m_to" type="email" value="'+esc(sv.email||'')+'">'+
   '<label>CC (optional)</label><input class="f" id="m_cc" type="email" value="'+esc(sv.cc||'')+'">'+
   '<div class="note">Saved with this vendor\'s details for this store.</div>'+
   '<div class="acts"><button class="btn o" id="m_x">Cancel</button><button class="btn g" id="m_send">Continue</button></div>');
  $('m_x').onclick=close;
  $('m_send').onclick=function(){var em=$('m_to').value.trim(),cc=$('m_cc').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('m_to').focus();toast('Enter a valid email');return;}
    sv.email=em;sv.cc=cc;save();close();then();};}
function emailAgain(o,vid){var sv=SV(null,vid);if(!sv.email){askEmail(vid,function(){sendMail(o,vid)});return;}sendMail(o,vid);}

// ---------- backup ----------
function backup(fname){var blob=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(typeof fname==='string'&&fname)||('PO Backup '+todayStr()+'.json');document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);}
function restore(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!(d.items||d.locations))throw 0;ST=d;ensureAll();loadDraft();close();persist('Backup restored')}catch(e){toast('That file is not a backup from this app')}};r.readAsText(file);}

// ---------- settings: stores & vendors ----------

  var locRows=ST.locations.map(function(l){var cur=l.id===ST.curLoc;

  '<label style="margin-top:20px">Vendors <span style="font-weight:400">(tap one to edit its rep, contacts and account # for each store)</span></label>'+venRows+
  '<div class="acts"><button class="btn o" id="s_addv">＋ Add vendor</button></div>'+
  '<label style="margin-top:20px">Backup / move to another phone or tablet</label><div class="acts" style="margin-top:4px"><button class="btn o" id="s_bk">Save backup file</button><label class="btn o" style="text-align:center;margin:0;color:var(--n)">Restore backup<input type="file" accept=".json,application/json" id="s_rs" style="display:none"></label></div>'+

  '<div class="acts"><button class="btn o" id="s_x">Close</button></div>');
  [].forEach.call(document.querySelectorAll('[data-le]'),function(el){el.onclick=function(){editLoc(el.dataset.le)}});
  [].forEach.call(document.querySelectorAll('[data-ve]'),function(el){el.onclick=function(){editVen(el.dataset.ve)}});

function editLoc(id){
  var l=id?findLoc(id):{name:'',addr:''};

  (id?'':'<label>Copy item lists from</label><select class="f" id="l_copy">'+ST.locations.map(function(x){return '<option value="'+x.id+'"'+(x.id===ST.curLoc?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'<option value="">Start with empty lists</option></select><div class="note">Copies the item list of every vendor. Each store\'s lists are separate afterwards.</div>')+
  '<div class="note">Each vendor\'s <b>rep, phone, email and account #</b> for this store are entered under <b>Settings › Vendors</b>.</div>'+
  '<div class="acts">'+(id&&ST.locations.length>1?'<button class="btn r" id="l_del">Delete</button>':'')+'<button class="btn o" id="l_x">Cancel</button><button class="btn g" id="l_ok">Save</button></div>');
  $('l_x').onclick=settings;

    ST.vendors.forEach(function(vn){var s=newSV();if(src){s.items=JSON.parse(JSON.stringify(src.vend[vn.id].items));s.sections=src.vend[vn.id].sections.slice();}v.vend[vn.id]=s;});
    ST.locations.push(v);ST.curLoc=v.id;loadDraft();save();
    open('<h2>Store added</h2><div class="note" style="font-size:15px;color:#333">Now using <b>'+esc(nm)+'</b>. Next, enter each vendor\'s rep, phone, email and account # for this store.</div><div class="acts"><button class="btn g" id="la_v">Set up vendor details</button></div><div class="acts"><button class="btn o" id="la_x">Later</button></div>');
    $('la_v').onclick=function(){editVen(ST.vendors[0].id)};$('la_x').onclick=function(){close();render();};};}

$('impbtn').onclick=importSheet;
$('back').onclick=function(){nav('home')};
$('bar').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act;
  if(a==='new')newOrderPicker();
  else if(a==='continue'){ST.curVen=b.dataset.v;loadDraft();save();nav('order');}
  else if(a==='review')review();
  else if(a==='startover')startOver(b.dataset.v);
});
$('q').oninput=function(){query=this.value.trim().toLowerCase();render()};
$('list').addEventListener('click',function(e){
  var t=e.target,s;
  if((s=t.closest('[data-co]'))){var vid=s.dataset.vid,o=SV(null,vid).history[+s.dataset.i];if(!o)return;if(s.dataset.co==='p')printOrder(o,vid);else emailAgain(o,vid);return;}
  if((s=t.closest('[data-nav]'))){nav(s.dataset.nav);return;}
  if((s=t.closest('[data-allv]'))){ST.curVen=s.dataset.allv;loadDraft();nav('completed');return;}
  if((s=t.closest('[data-hv]'))){homeCol[s.dataset.hv]=!homeCol[s.dataset.hv];render();return;}
  if(t.closest('[data-loc]')){if(ST.locations.length>1)pickLoc();else editLoc(ST.curLoc);return;}
  if((s=t.closest('.sech'))){var k=s.dataset.sec;collapsed[k]=!collapsed[k];render();return;}
  if(t.dataset.p){setQty(t.dataset.p,(draft[t.dataset.p]||0)+1);return;}
  if(t.dataset.m){setQty(t.dataset.m,(draft[t.dataset.m]||0)-1);return;}
  if((s=t.closest('[data-edit]'))){editItem(s.dataset.edit);}
});
$('list').addEventListener('input',function(e){if(e.target.dataset.q)setQty(e.target.dataset.q,e.target.value)});
$('list').addEventListener('focusin',function(e){if(e.target.dataset.q)e.target.select()});
$('fab').onclick=function(){editItem(null)};
$('gear').onclick=settings;
ensureAll();save();loadDraft();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
