function finish(lines,how){

  if($('l_del'))$('l_del').onclick=function(){var b=this;if(b.dataset.c){ST.locations=ST.locations.filter(function(x){return x.id!==id});try{localStorage.removeItem('gulfOrderDraft_'+id)}catch(e){}ensureLoc();loadDraft();close();persist('Location deleted');}else{b.dataset.c=1;b.textContent='Tap again – deletes its '+l.history.length+' orders';}};
  $('l_ok').onclick=function(){var nm=$('l_name').value.trim();if(!nm){$('l_name').focus();return;}
    var v={name:nm,addr:$('l_addr').value.trim(),acct:$('l_acct').value.trim(),rep:$('l_rep').value.trim(),email:$('l_em').value.trim(),cc:$('l_cc').value.trim()};
    if(id){for(var k in v)l[k]=v[k];close();persist('Location saved');}
    else{v.id='L'+(ST.nextLocId=(ST.nextLocId||2)+0);ST.nextLocId++;v.history=[];v.last={};v.nextOrderNo=1001;v.lastOrderDate='';var cs=$('l_copy').value,src=cs?findLoc(cs):null;v.items=src?JSON.parse(JSON.stringify(src.items)):[];v.sections=src?src.sections.slice():[];ST.locations.push(v);ST.curLoc=v.id;loadDraft();close();persist('Location added – now using '+nm);}};}
function pickLoc(){
  open('<h2>Choose location</h2>'+ST.locations.map(function(l){var cur=l.id===ST.curLoc;return '<div class="link" data-pk="'+l.id+'" style="'+(cur?'border-color:var(--g);background:var(--g2)':'')+'"><span>'+(cur?'✓ ':'')+esc(l.name)+(l.acct?' <span style="font-weight:500;color:#6b7280">· Acct # '+esc(l.acct)+'</span>':'')+'</span><span>›</span></div>'}).join('')+
   '<div class="acts"><button class="btn o" id="p_x">Cancel</button></div>');
  [].forEach.call(document.querySelectorAll('[data-pk]'),function(el){el.onclick=function(){ST.curLoc=el.dataset.pk;loadDraft();view='home';close();persist('Now using '+L().name);window.scrollTo(0,0);}});
  $('p_x').onclick=close;}
// ---------- events ----------
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;itemsTab=b.dataset.f;render();window.scrollTo(0,0)};
$('back').onclick=function(){nav('home')};
$('list').addEventListener('click',function(e){var n=e.target.closest('[data-nav]');if(n)nav(n.dataset.nav);if(e.target.closest('[data-loc]')){if(ST.locations.length>1)pickLoc();else editLoc(ST.curLoc);}});
$('bar').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act;
  if(a==='new'||a==='continue'){if(a==='new')orderY=0;nav('order');if(a==='new')toast('Tap + next to the items you need');}
  else if(a==='review')review();
  else if(a==='startover'){var p=nOrd();open('<h2>Start over?</h2><div class="note" style="font-size:15px;color:#333">This clears the order in progress ('+p.n+' items). It has not been submitted.</div><div class="acts"><button class="btn o" id="n_x">Cancel</button><button class="btn r" id="n_go">Clear &amp; start new</button></div>');$('n_x').onclick=close;$('n_go').onclick=function(){draft={};saveDraft();orderY=0;nav('order');toast('New order started');};}
});
$('q').oninput=function(){query=this.value.trim().toLowerCase();render()};
$('list').addEventListener('click',function(e){
  var t=e.target,s;
  if((s=t.closest('.sech'))){var k=s.dataset.sec;collapsed[k]=!collapsed[k];render();return;}
  if(t.dataset.p){setQty(t.dataset.p,(draft[t.dataset.p]||0)+1);return;}
  if(t.dataset.m){setQty(t.dataset.m,(draft[t.dataset.m]||0)-1);return;}
  if((s=t.closest('[data-edit]'))){editItem(s.dataset.edit);}
});
$('list').addEventListener('input',function(e){if(e.target.dataset.q)setQty(e.target.dataset.q,e.target.value)});
$('list').addEventListener('focusin',function(e){if(e.target.dataset.q)e.target.select()});
$('fab').onclick=function(){editItem(null)};
$('gear').onclick=settings;
$('list').addEventListener('click',function(e){var b=e.target.closest('[data-co]');if(!b)return;var o=L().history[+b.dataset.i];if(!o)return;if(b.dataset.co==='p')printOrder(o);else emailOrder(o,null);});
ensureLoc();loadDraft();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
