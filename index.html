<script id="app">
(function(){
var ST=JSON.parse(document.getElementById('state').textContent);
var DRAFT_KEY='gulfOrderDraft_v1';
var draft={};try{draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}')||{};}catch(e){draft={};}
var filter='active',query='',collapsed={},art=null,canWrite=true;
try{var ui=JSON.parse(sessionStorage.getItem('gulfUI')||'null');if(ui){filter=ui.filter||filter;collapsed=ui.collapsed||{};setTimeout(function(){window.scrollTo(0,ui.y||0)},50);sessionStorage.removeItem('gulfUI');}}catch(e){}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}catch(e){}}
function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},2200)}
function fmtDate(d){if(!d)return'';var x=new Date(/^\d{4}-\d{2}-\d{2}$/.test(d)?d+'T12:00':d);return isNaN(x)?d:x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function desc(it){return [it.size,it.pack&&it.pack!=='1'?it.pack:'',it.type].filter(Boolean).join(' · ')}

function chips(){var nOrd=Object.keys(draft).length;var defs=[['active',nOrd?'🛒 Current Order':'＋ New Order'],['ordered','Selected Items'+(nOrd?' ('+nOrd+')':'')],['completed','Completed Orders'+(ST.history.length?' ('+ST.history.length+')':'')],['inactive','Not Carried'],['all','All Items']];
  $('chips').innerHTML=defs.map(function(d){return '<button class="chip'+(filter===d[0]?' on':'')+'" data-f="'+d[0]+'">'+d[1]+'</button>'}).join('');}
function match(it){
  if(filter==='active'&&!it.active)return false;
  if(filter==='inactive'&&it.active)return false;
  if(filter==='ordered'&&!(draft[it.id]>0))return false;
  if(query){var h=(it.name+' '+it.size+' '+it.pack+' '+it.type+' '+it.sec).toLowerCase();return query.split(/\s+/).every(function(w){return h.indexOf(w)>=0})}
  return true;}
function render(){
  chips();
  $('q').style.display=filter==='completed'?'none':'';
  $('fab').style.display=filter==='completed'?'none':'';
  if(filter==='completed'){renderCompleted();summary();return;}
  $('sub').textContent='KRRS-NA Bridgeport · BP Food Mart'+(ST.lastOrderDate?' · Last order '+fmtDate(ST.lastOrderDate):'');
  var html='',any=false;
  ST.sections.forEach(function(sec){
    var its=ST.items.filter(function(it){return it.sec===sec&&match(it)});
    if(!its.length)return;any=true;
    var open=query||!collapsed[sec];
    var oc=its.filter(function(it){return draft[it.id]>0}).length;
    html+='<div class="sec"><div class="sech'+(/^RED BULL/.test(sec)?' rb':'')+'" data-sec="'+esc(sec)+'"><span>'+(open?'▾ ':'▸ ')+esc(sec)+'</span><span class="cnt">'+its.length+' items'+(oc?' · '+oc+' ordered':'')+'</span></div>';
    if(open)its.forEach(function(it){
      var q=draft[it.id]||0;
      html+='<div class="item'+(it.active?'':' inactive')+(q>0?' ordered':'')+'" data-id="'+it.id+'"><div class="info" data-edit="'+it.id+'"><div class="nm">'+esc(it.name)+'</div><div class="meta"><span>'+esc(desc(it))+'</span>'+
        (it.last!=null&&it.last!==''?'<span class="last">Last: '+esc(it.last)+'</span>':'<span class="last none">Last: –</span>')+
        (it.active?'':'<span class="tag in">NOT CARRIED</span>')+'</div></div>'+
        (it.active?'<div class="step"><button data-m="'+it.id+'" aria-label="minus">−</button><input inputmode="numeric" pattern="[0-9]*" data-q="'+it.id+'" value="'+(q||'')+'" placeholder="0"><button class="plus" data-p="'+it.id+'" aria-label="plus">+</button></div>':'')+'</div>';
    });
    html+='</div>';
  });
  $('list').innerHTML=any?html:'<div class="empty">No items match.</div>';
  summary();
}
function summary(){var lines=0,units=0;ST.items.forEach(function(it){var q=draft[it.id]||0;if(q>0&&it.active){lines++;units+=q}});
  $('sum').innerHTML='<b>'+units+'</b> units · '+lines+' items';}
function setQty(id,q){q=Math.max(0,Math.min(999,parseInt(q,10)||0));if(q)draft[id]=q;else delete draft[id];saveDraft();
  var row=document.querySelector('.item[data-id="'+id+'"]');if(row){row.classList.toggle('ordered',q>0);var inp=row.querySelector('input');if(inp&&document.activeElement!==inp)inp.value=q||'';}
  summary();chips();}
function find(id){for(var i=0;i<ST.items.length;i++)if(ST.items[i].id===id)return ST.items[i];}

// ---------- save on this device ----------
var SKEY='gulfOrderState_v1';
try{var ls=localStorage.getItem(SKEY);if(ls){ST=JSON.parse(ls)}}catch(e){}
function persist(msg){try{localStorage.setItem(SKEY,JSON.stringify(ST));toast(msg)}catch(e){toast('Could not save on this device')}render();}
// ---------- sheets ----------
function open(html){$('sheet').innerHTML=html;$('ov').classList.add('show');}
function close(){$('ov').classList.remove('show');}
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))close()});

function secOptions(sel){return ST.sections.map(function(s){return '<option'+(s===sel?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'<option value="__new">+ New section…</option>'}
function editItem(id){
  var it=id?find(id):{id:null,sec:ST.sections[0],size:'12 oz',pack:'6 pk',name:'',type:'Can',last:null,active:true};
  open('<h2>'+(id?'Edit item':'Add new item')+'</h2>'+
  '<label>Product name</label><input class="f" id="e_name" value="'+esc(it.name)+'" placeholder="e.g. Michelob Ultra">'+
  '<label>Section</label><select class="f" id="e_sec">'+secOptions(it.sec)+'</select><input class="f" id="e_newsec" placeholder="New section name" style="display:none;margin-top:6px">'+
  '<div class="row"><div><label>Size</label><input class="f" id="e_size" value="'+esc(it.size)+'"></div><div><label>Pack</label><input class="f" id="e_pack" value="'+esc(it.pack)+'"></div></div>'+
  '<div class="row"><div><label>Type</label><select class="f" id="e_type">'+['Can','Btl',''].map(function(t){return '<option value="'+t+'"'+(t===it.type?' selected':'')+'>'+(t||'—')+'</option>'}).join('')+'</select></div>'+
  '<div><label>Last order qty</label><input class="f" id="e_last" inputmode="numeric" value="'+(it.last==null?'':esc(it.last))+'"></div></div>'+
  '<label>Do we carry this item?</label><div class="tog" id="e_st"><button data-v="1" class="a'+(it.active?' on':'')+'">Yes – we carry it</button><button data-v="0" class="i'+(it.active?'':' on')+'">No – Not Carried</button></div>'+
  '<div class="acts">'+(id?'<button class="btn r" id="e_del">Delete</button>':'')+'<button class="btn o" id="e_cancel">Cancel</button><button class="btn g" id="e_save">Save</button></div>'+
  '<div class="note">Not Carried items move to the <b>Not Carried</b> tab and can\'t be ordered. Switch back any time.</div>');
  var active=it.active;
  $('e_sec').onchange=function(){$('e_newsec').style.display=this.value==='__new'?'block':'none'};
  $('e_st').onclick=function(e){var b=e.target.closest('button');if(!b)return;active=b.dataset.v==='1';[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)})};
  $('e_cancel').onclick=close;
  if(id)$('e_del').onclick=function(){
    var b=this;if(b.dataset.c){ST.items=ST.items.filter(function(x){return x.id!==id});delete draft[id];saveDraft();close();persist('Item deleted');}
    else{b.dataset.c=1;b.textContent='Tap again to delete';}};
  $('e_save').onclick=function(){
    var name=$('e_name').value.trim();if(!name){$('e_name').focus();return;}
    var sec=$('e_sec').value;if(sec==='__new'){sec=$('e_newsec').value.trim().toUpperCase();if(!sec){$('e_newsec').focus();return;}if(ST.sections.indexOf(sec)<0)ST.sections.push(sec);}
    var lv=$('e_last').value.trim();var last=lv===''?null:(isNaN(+lv)?lv:+lv);
    var obj={sec:sec,name:name,size:$('e_size').value.trim(),pack:$('e_pack').value.trim(),type:$('e_type').value,last:last,active:active};
    if(id){var t=find(id);for(var k in obj)t[k]=obj[k];if(!active){delete draft[id];saveDraft();}}
    else{obj.id='i'+(ST.nextId++);var idx=-1;ST.items.forEach(function(x,i){if(x.sec===sec)idx=i});if(idx<0)ST.items.push(obj);else ST.items.splice(idx+1,0,obj);}
    close();persist(id?'Item updated':'Item added');
  };
}
function nextNo(){return 'GO-'+(ST.nextOrderNo||1001)}
function todayStr(){var dd=new Date();return dd.getFullYear()+'-'+('0'+(dd.getMonth()+1)).slice(-2)+'-'+('0'+dd.getDate()).slice(-2)}
function orderLines(){return ST.items.filter(function(it){return it.active&&draft[it.id]>0})}
function oLines(o){return o.lines.map(function(l){return Array.isArray(l)?{sec:'',name:l[0],size:'',pack:'',type:'',qty:l[1]}:l})}
function oUnits(o){return oLines(o).reduce(function(a,l){return a+(+l.qty||0)},0)}
function ldesc(l){return [l.size,l.pack&&l.pack!=='1'?l.pack:'',l.type].filter(Boolean).join(' · ')}
function orderText(o){var t='Gulf Distributing order – KRRS-NA Bridgeport (BP Food Mart)\nOrder #: '+o.no+'\nDate: '+fmtDate(o.date)+'\n';var cur='';
  oLines(o).forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;t+='\n'+cur+'\n'}t+='  '+l.qty+' x '+l.name+(ldesc(l)?' ('+ldesc(l)+')':'')+'\n'});
  return t+'\nTotal: '+oUnits(o)+' units, '+o.lines.length+' items';}
function review(){
  var lines=orderLines();
  if(!lines.length){open('<h2>Review order</h2><div class="empty">Nothing on this order yet.<br>Go to <b>＋ New Order</b> and tap + next to an item.</div><div class="acts"><button class="btn o" id="r_x">Close</button></div>');$('r_x').onclick=close;return;}
  var cur='',h='';lines.forEach(function(it){if(it.sec!==cur){cur=it.sec;h+='<div class="h"><span>'+esc(cur)+'</span><span>Qty</span></div>'}h+='<div><span>'+esc(it.name)+' <span style="color:#6b7280">'+esc(desc(it))+'</span></span><b>'+draft[it.id]+'</b></div>'});
  var u=lines.reduce(function(a,it){return a+draft[it.id]},0);
  open('<h2>Review order <span style="font-size:14px;color:#6b7280">#'+nextNo()+'</span></h2><div class="rv">'+h+'<div class="h"><span>TOTAL ('+lines.length+' items)</span><span>'+u+'</span></div></div>'+
  '<div class="note">Check the quantities. To change something, tap <b>Keep editing</b>.</div>'+
  '<div class="acts"><button class="btn o" id="r_x">Keep editing</button><button class="btn r" id="r_clr">Clear order</button></div>'+
  '<div class="acts"><button class="btn g" id="r_sub" style="font-size:17px;padding:15px">Submit order ➜</button></div>');
  $('r_x').onclick=close;
  $('r_clr').onclick=function(){var b=this;if(b.dataset.c){draft={};saveDraft();close();render();toast('Order cleared')}else{b.dataset.c=1;b.textContent='Tap again to clear'}};
  $('r_sub').onclick=function(){submitChoice(lines)};
}
function submitChoice(lines){
  var no=nextNo();
  open('<h2>Submit order #'+no+'</h2><div class="note" style="font-size:15px;color:#333">How do you want to send this order to Gulf?</div>'+
   '<div class="acts"><button class="btn" id="s_p" style="padding:15px">🖨 Print</button><button class="btn" id="s_e" style="padding:15px">✉ Email</button></div>'+
   '<div class="acts"><button class="btn g" id="s_b" style="padding:15px">🖨 + ✉ Both</button></div>'+
   '<div class="acts"><button class="btn o" id="s_x">Back</button></div>'+
   '<div class="note">Choosing one <b>completes</b> the order: it moves to <b>Completed Orders</b>, a backup file is saved, the quantities become each item\'s new <b>Last</b> qty, and the list is cleared for next time.</div>');
  $('s_x').onclick=review;
  $('s_p').onclick=function(){finish(lines,'p')};
  $('s_e').onclick=function(){finish(lines,'e')};
  $('s_b').onclick=function(){finish(lines,'b')};
}
function finish(lines,how){
  if(how!=='p'&&!ST.email){ // ask for email first
    emailOrder(null,function(){finish(lines,how)});return;}
  var now=todayStr(),no=nextNo();ST.nextOrderNo=(ST.nextOrderNo||1001)+1;
  var o={no:no,date:now,sent:how==='p'?'Printed':how==='e'?'Emailed':'Printed & emailed',lines:lines.map(function(it){return {sec:it.sec,name:it.name,size:it.size,pack:it.pack,type:it.type,qty:draft[it.id]}})};
  ST.history.unshift(o);if(ST.history.length>200)ST.history.length=200;
  lines.forEach(function(it){it.last=draft[it.id]});
  ST.lastOrderDate=now;draft={};saveDraft();
  try{localStorage.setItem(SKEY,JSON.stringify(ST))}catch(e){}
  backup('Gulf Order Backup '+no+' '+now+'.json');
  filter='completed';close();render();window.scrollTo(0,0);
  toast('Order '+no+' completed');
  setTimeout(function(){
    if(how==='p')printOrder(o);
    else if(how==='e')sendMail(o);
    else{printOrder(o,function(){open('<h2>Order #'+no+' printed</h2><div class="note" style="font-size:15px;color:#333">Now send the email.</div><div class="acts"><button class="btn g" id="b_e" style="padding:15px">✉ Open email</button></div><div class="acts"><button class="btn o" id="b_x">Skip</button></div>');$('b_e').onclick=function(){close();sendMail(o)};$('b_x').onclick=close;});}
  },700);
}
function renderCompleted(){
  if(!ST.history.length){$('list').innerHTML='<div class="empty">No completed orders yet.<br>Tap <b>＋ New Order</b>, add items, tap <b>Review &amp; Submit</b>, then <b>Submit order</b>.</div>';return;}
  $('list').innerHTML=ST.history.map(function(o,i){var ls=oLines(o),cur='',rows='';
    ls.forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;rows+='<div class="h"><span>'+esc(cur)+'</span><span>Qty</span></div>'}rows+='<div><span>'+esc(l.name)+' <span style="color:#6b7280">'+esc(ldesc(l))+'</span></span><b>'+l.qty+'</b></div>'});
    return '<details class="item" style="display:block;margin-top:8px"'+(i===0?' open':'')+'><summary style="font-weight:700;cursor:pointer;list-style:none"><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--n)">✓ '+esc(o.no||'Order')+'</span><span style="font-weight:500;color:#6b7280">'+fmtDate(o.date)+'</span></div>'+
      '<div class="meta"><span>'+oUnits(o)+' units · '+ls.length+' items</span>'+(o.sent?'<span class="last" style="background:#e6f4ec;color:#00843D">'+esc(o.sent)+'</span>':'')+'</div></summary>'+
      '<div class="rv" style="margin-top:8px">'+rows+'</div><div class="acts"><button class="btn o" data-co="p" data-i="'+i+'">🖨 Print again</button><button class="btn o" data-co="e" data-i="'+i+'">✉ Email again</button></div></details>'}).join('');}
function showText(t){open('<h2>Order text</h2><textarea class="f" style="height:300px" readonly>'+esc(t)+'</textarea><div class="note">Select all and copy.</div><div class="acts"><button class="btn o" id="t_x">Close</button></div>');$('t_x').onclick=close;}
function printOrder(o,after){
  var cur='',rows='';
  oLines(o).forEach(function(l){if(l.sec&&l.sec!==cur){cur=l.sec;rows+='<tr class="s"><td colspan="5">'+esc(cur)+'</td></tr>'}
    rows+='<tr><td>'+esc(l.name)+'</td><td>'+esc(l.size)+'</td><td>'+esc(l.pack)+'</td><td>'+esc(l.type)+'</td><td class="q">'+l.qty+'</td></tr>'});
  $('printArea').innerHTML='<h1>Gulf Distributing – Beer &amp; Red Bull Order</h1><div>KRRS-NA Bridgeport LLC · BP Food Mart · Bridgeport, AL</div><div><b>Order #: '+esc(o.no)+'</b> &nbsp;&nbsp; Order date: '+fmtDate(o.date)+' &nbsp;&nbsp; Sales rep: '+esc(ST.rep||'')+'</div>'+
    '<table><tr><th>Product</th><th>Size</th><th>Pack</th><th>Type</th><th>Qty</th></tr>'+rows+'<tr class="s"><td colspan="4">TOTAL ('+o.lines.length+' items)</td><td class="q">'+oUnits(o)+'</td></tr></table>'+
    '<p style="margin-top:30px">Received by: ______________________ &nbsp;&nbsp;&nbsp; Date: ____________</p>';
  close();
  if(after){var done=false;var go=function(){if(done)return;done=true;window.removeEventListener('afterprint',go);setTimeout(after,300)};window.addEventListener('afterprint',go);setTimeout(function(){window.print();setTimeout(go,1500)},150);}
  else setTimeout(function(){window.print()},150);}
function sendMail(o){var em=ST.email||'',cc=ST.cc||'';
  var url='mailto:'+em+'?'+(cc?'cc='+encodeURIComponent(cc)+'&':'')+'subject='+encodeURIComponent('Order '+o.no+' – BP Food Mart Bridgeport – '+fmtDate(o.date))+'&body='+encodeURIComponent(orderText(o)+'\n\nThank you,\nSatyapal\nBP Food Mart – Bridgeport, AL');
  window.location.href=url;}
function emailOrder(o,then){
  open('<h2>'+(o?'Email order #'+esc(o.no):'Where should orders be emailed?')+'</h2><label>Send to</label><input class="f" id="m_to" type="email" value="'+esc(ST.email||'')+'" placeholder="rep@gulfdistributing.com">'+
   '<label>CC (optional)</label><input class="f" id="m_cc" type="email" value="'+esc(ST.cc||'')+'">'+
   '<div class="note">Opens your mail app with the order filled in – then tap Send there. This address is remembered.</div>'+
   '<div class="acts"><button class="btn o" id="m_x">Cancel</button><button class="btn g" id="m_send">'+(o?'Open mail app':'Continue')+'</button></div>');
  $('m_x').onclick=close;
  $('m_send').onclick=function(){var em=$('m_to').value.trim(),cc=$('m_cc').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('m_to').focus();toast('Enter a valid email');return;}
    ST.email=em;ST.cc=cc;try{localStorage.setItem(SKEY,JSON.stringify(ST))}catch(e){}
    close();if(then)then();else if(o)sendMail(o);};}
function backup(fname){var blob=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(typeof fname==='string'&&fname)||('Gulf Order Backup '+new Date().toISOString().slice(0,10)+'.json');document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);}
function restore(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.items||!d.sections)throw 0;ST=d;close();persist('Backup restored')}catch(e){toast('That file is not a Gulf Order backup')}};r.readAsText(file);}
function settings(){
  open('<h2>Settings</h2><label>Sales rep (name · phone)</label><input class="f" id="s_rep" value="'+esc(ST.rep||'')+'">'+
  '<label>Order email – send to</label><input class="f" id="s_em" type="email" value="'+esc(ST.email||'')+'">'+
  '<label>CC (optional)</label><input class="f" id="s_cc" type="email" value="'+esc(ST.cc||'')+'">'+
  '<div class="acts"><button class="btn o" id="s_x">Cancel</button><button class="btn g" id="s_ok">Save</button></div>'+
  '<label style="margin-top:20px">Move your list to another phone/tablet</label><div class="acts" style="margin-top:4px"><button class="btn o" id="s_bk">Save backup file</button><label class="btn o" style="text-align:center;margin:0;color:var(--n)">Restore backup<input type="file" accept=".json,application/json" id="s_rs" style="display:none"></label></div>'+
  '<div class="note">Your items, Last qty and history are saved on this device only.</div>');
  $('s_bk').onclick=function(){backup()};$('s_rs').onchange=function(){if(this.files[0])restore(this.files[0])};
  $('s_x').onclick=close;$('s_ok').onclick=function(){ST.rep=$('s_rep').value.trim();ST.email=$('s_em').value.trim();ST.cc=$('s_cc').value.trim();close();persist('Settings saved')};}
// ---------- events ----------
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;render();window.scrollTo(0,0)};
$('q').oninput=function(){query=this.value.trim().toLowerCase();render()};
$('list').addEventListener('click',function(e){
  var t=e.target,s;
  if((s=t.closest('.sech'))){var k=s.dataset.sec;collapsed[k]=!collapsed[k];render();return;}
  if(t.dataset.p){setQty(t.dataset.p,(draft[t.dataset.p]||0)+1);return;}
  if(t.dataset.m){setQty(t.dataset.m,(draft[t.dataset.m]||0)-1);return;}
  if((s=t.closest('[data-edit]'))){editItem(s.dataset.edit);}
});
$('list').addEventListener('input',function(e){if(e.target.dataset.q)setQty(e.target.dataset.q,e.target.value)});
$('list').addEventListener('focusin',function(e){if(e.target.dataset.q)e.target.select()});
$('fab').onclick=function(){editItem(null)};
$('revBtn').onclick=review;$('gear').onclick=settings;
$('list').addEventListener('click',function(e){var b=e.target.closest('[data-co]');if(!b)return;var o=ST.history[+b.dataset.i];if(!o)return;if(b.dataset.co==='p')printOrder(o);else emailOrder(o,null);});
$('newOrd').onclick=function(){
  var n=Object.keys(draft).length;
  function start(){draft={};saveDraft();filter='active';query='';$('q').value='';close();render();window.scrollTo(0,0);toast('New order started – tap + to add items');}
  if(!n){start();return;}
  open('<h2>Start a new order?</h2><div class="note" style="font-size:15px;color:#333">The current order has '+n+' item(s) that were not submitted. Starting a new order will clear them.</div>'+
   '<div class="acts"><button class="btn o" id="n_x">Cancel</button><button class="btn g" id="n_rev">Review current</button></div><div class="acts"><button class="btn r" id="n_go">Clear &amp; start new</button></div>');
  $('n_x').onclick=close;$('n_rev').onclick=function(){close();review()};$('n_go').onclick=start;};
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
